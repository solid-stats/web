<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solid Stats — Player · Sonr</title>
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="kit.css" />
<link rel="stylesheet" href="overview.css" />
<link rel="stylesheet" href="player.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="tiers.js"></script>
<script src="data-overview.js"></script>
<script src="data-player.js"></script>
<script src="i18n.js"></script>
<script src="i18n-player.js"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="overview.jsx"></script>
<script type="text/babel" src="player.jsx"></script>

<script type="text/babel" data-presets="react">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "lang": "RU",
    "device": "desktop",
    "dataset": "typical",
    "fresh": "ok",
    "signedIn": true
  }/*EDITMODE-END*/;

  function App() {
    const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const [searchOpen, setSearchOpen] = React.useState(false);

    React.useEffect(() => {
      document.documentElement.setAttribute('data-theme', 'dark');
    }, []);

    React.useEffect(() => {
      window.__FORCE_MOBILE = tw.device === 'mobile' ? true : (tw.device === 'desktop' ? null : false);
      window.dispatchEvent(new Event('forcemedia'));
    }, [tw.device]);

    React.useEffect(() => {
      const onKey = (e) => {
        if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !/INPUT|TEXTAREA/.test((e.target.tagName||'')))) {
          e.preventDefault(); setSearchOpen(true);
        }
      };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, []);

    const setLang = (l) => setTweak('lang', l);
    const FRAME = { mobile: [390, 844], tablet: [834, 1040] };
    const dims = FRAME[tw.device];

    const app = (
      <Shell lang={tw.lang} setLang={setLang} signedIn={tw.signedIn} active="players" onSearch={() => setSearchOpen(true)}>
        <PlayerProfile lang={tw.lang} device={tw.device} dataset={tw.dataset} fresh={tw.fresh || 'ok'} />
        <SearchOverlay open={searchOpen} onClose={() => setSearchOpen(false)} lang={tw.lang} />
      </Shell>
    );

    return (
      <>
        {dims ? (
          <div className="stage framed">
            <div className="dev-label">{tw.device} · {dims[0]}×{dims[1]}</div>
            <div className="devframe" data-device={tw.device} style={{ width: dims[0], height: dims[1] }}>
              <div className="devscroll">{app}</div>
            </div>
          </div>
        ) : (
          <div className="stage">{app}</div>
        )}

        <TweaksPanel>
          <TweakSection label="Device" />
          <TweakRadio label="Viewport" value={tw.device} options={['mobile', 'tablet', 'desktop']}
            onChange={(v) => setTweak('device', v)} />
          <TweakSection label="Locale" />
          <TweakRadio label="Language" value={tw.lang} options={['EN', 'RU']}
            onChange={(v) => setTweak('lang', v)} />
          <TweakSection label="Data" />
          <TweakRadio label="Volume" value={tw.dataset || 'typical'} options={['typical', 'heavy']}
            onChange={(v) => setTweak('dataset', v)} />
          <TweakSection label="Freshness" />
          <TweakRadio label="State" value={tw.fresh || 'ok'} options={['ok', 'stale', 'offline', 'recon']}
            onChange={(v) => setTweak('fresh', v)} />
          <TweakSection label="Account" />
          <TweakToggle label="Signed in" value={tw.signedIn}
            onChange={(v) => setTweak('signedIn', v)} />
        </TweaksPanel>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<template id="__bundler_thumbnail" data-bg-color="#0A0D13">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect x="450" y="300" width="78" height="170" rx="14" fill="#5B6678"/>
    <rect x="561" y="220" width="78" height="250" rx="14" fill="#36C5E0"/>
    <rect x="672" y="140" width="78" height="330" rx="14" fill="#36C5E0"/>
    <text x="600" y="560" text-anchor="middle" font-family="'Saira',sans-serif" font-weight="700" font-size="56" fill="#EAEEF6">Solid Stats</text>
    <text x="600" y="616" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="28" fill="#616B80">Игрок · Player</text>
  </svg>
</template>
</body>
</html>
