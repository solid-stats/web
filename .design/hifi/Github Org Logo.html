<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solid Stats — GitHub avatar (frameless options)</title>
<link rel="stylesheet" href="../_ds/solid-stats-design-system-b40cf4ce-23e3-4582-9166-7db1e5876043/colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-0); color: var(--fg-1); font-family: var(--font-sans); }
  .wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 56px 32px 88px; box-sizing: border-box; }
  .head { text-align: center; }
  .ov { font-family: var(--font-mono); font-size: 11px; letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--fg-3); margin-bottom: 10px; }
  .ti { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: -0.01em; }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 420px)); gap: 28px; width: 100%; max-width: 900px; }
  .card { background: var(--surface-1); border: 1px solid var(--border-1); border-radius: var(--radius-lg); padding: 26px; display: flex; flex-direction: column; gap: 20px; }
  .card .lbl { font-family: var(--font-sans); font-size: 12px; font-weight: 600; letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--fg-2); }
  .card .desc { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-top: -12px; line-height: 1.5; }
  .big { width: 100%; aspect-ratio: 1; border-radius: 22.6%; box-shadow: var(--shadow-md); }
  .sizes { display: flex; align-items: flex-end; gap: 22px; }
  .spec { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .gh { border-radius: 22.6%; overflow: hidden; box-shadow: var(--shadow-sm); }
  .s64 { width: 64px; height: 64px; } .s40 { width: 40px; height: 40px; } .s28 { width: 28px; height: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="ov">SolidStats · github.com/solid-stats</div>
    <div class="ti">Organization avatar — frameless options</div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
/* Shared tile + bar gradients; one defs block injected per svg with unique ids. */
function defs(id){
  return `<defs>
    <linearGradient id="tile${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161C28"/><stop offset="1" stop-color="#0C1019"/></linearGradient>
    <linearGradient id="barC${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#27A8C2"/><stop offset="1" stop-color="#54D3EC"/></linearGradient>
  </defs>`;
}
const tile = id => `<rect x="0" y="0" width="512" height="512" fill="url(#tile${id})"/>`;

/* Each variant returns inner SVG markup (sans <svg> wrapper). */
const variants = {
  // A — clean three bars, no frame, no baseline. Bigger bars, centered mass.
  A: id => tile(id) + `
    <rect x="118" y="300" width="64" height="94"  rx="12" fill="#5B6678"/>
    <rect x="224" y="216" width="64" height="178" rx="12" fill="url(#barC${id})"/>
    <rect x="330" y="132" width="64" height="262" rx="12" fill="url(#barC${id})"/>`,

  // B — frameless but keeps the thin baseline as a grounding line.
  B: id => tile(id) + `
    <rect x="118" y="392" width="276" height="4" rx="2" fill="#2E394F"/>
    <rect x="118" y="296" width="60" height="92"  rx="11" fill="#5B6678"/>
    <rect x="226" y="214" width="60" height="174" rx="11" fill="url(#barC${id})"/>
    <rect x="334" y="132" width="60" height="256" rx="11" fill="url(#barC${id})"/>`,

  // C — all-cyan ascending, opacity rhythm instead of a gray bar. Boldest.
  C: id => tile(id) + `
    <rect x="118" y="300" width="64" height="94"  rx="12" fill="url(#barC${id})" opacity="0.42"/>
    <rect x="224" y="216" width="64" height="178" rx="12" fill="url(#barC${id})" opacity="0.72"/>
    <rect x="330" y="132" width="64" height="262" rx="12" fill="url(#barC${id})"/>`,

  // D — tighter, taller bars, no frame: a sharper "graph" read.
  D: id => tile(id) + `
    <rect x="150" y="288" width="48" height="120" rx="9" fill="#5B6678"/>
    <rect x="232" y="200" width="48" height="208" rx="9" fill="url(#barC${id})"/>
    <rect x="314" y="120" width="48" height="288" rx="9" fill="url(#barC${id})"/>`,
};

const meta = {
  A: ['Option A · Clean bars', 'No frame, no baseline. Three bars, 1 muted + 2 cyan. Most balanced.'],
  B: ['Option B · Grounded', 'Frameless but keeps a hairline baseline the bars sit on.'],
  C: ['Option C · All-cyan', 'Ascending opacity instead of a gray bar — boldest, most brand-forward.'],
  D: ['Option D · Sharp graph', 'Thinner, taller bars — reads more like a chart spike.'],
};

const grid = document.getElementById('grid');
Object.keys(variants).forEach(k => {
  const inner = variants[k](k);
  const svg = s => `<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" ${s}>${defs(k)}${inner}</svg>`;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="lbl">${meta[k][0]}</div>
    <div class="desc">${meta[k][1]}</div>
    ${svg('class="big"')}
    <div class="sizes">
      <div class="spec"><div class="gh s64">${svg('width="64" height="64" style="display:block"')}</div><div class="cap">64</div></div>
      <div class="spec"><div class="gh s40">${svg('width="40" height="40" style="display:block"')}</div><div class="cap">40</div></div>
      <div class="spec"><div class="gh s28">${svg('width="28" height="28" style="display:block"')}</div><div class="cap">28</div></div>
    </div>`;
  grid.appendChild(card);
});
</script>
<template id="__bundler_thumbnail" data-bg-color="#0A0D13">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect x="450" y="300" width="78" height="170" rx="14" fill="#5B6678"/>
    <rect x="561" y="220" width="78" height="250" rx="14" fill="#36C5E0"/>
    <rect x="672" y="140" width="78" height="330" rx="14" fill="#36C5E0"/>
    <text x="600" y="560" text-anchor="middle" font-family="'Saira',sans-serif" font-weight="700" font-size="56" fill="#EAEEF6">Solid Stats</text>
    <text x="600" y="616" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="28" fill="#616B80">GitHub avatar</text>
  </svg>
</template>
</body>
</html>
