<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stats Overview — Wireframes (dark, mobile-first)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0a0e12; }
  * { -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wf-kit.jsx"></script>
<script type="text/babel" src="wf-stats.jsx"></script>
<script type="text/babel" src="wf-mobile.jsx"></script>
<script type="text/babel" src="wf-desktop.jsx"></script>

<script type="text/babel" data-presets="react">
  function App() {
    return (
      <DesignCanvas>
        <DCSection id="chosen" title="Stats overview — chosen direction" subtitle="Mobile = segmented leaderboards · Desktop = multi-column digest · SCORE (kills ÷ games) is the headline; K/D demoted to the full list / player page">
          <DCArtboard id="m1" label="Mobile · Segmented leaderboards — Score = kills ÷ games" width={390} height={892}><MobSeg /></DCArtboard>
          <DCArtboard id="d2" label="Desktop · Multi-column digest — Kills · Games · Score" width={1200} height={680}><DeskStack /></DCArtboard>
        </DCSection>
        <DCSection id="alts" title="Other explorations (parked)" subtitle="Kept for reference — not the chosen direction">
          <DCArtboard id="m2" label="Mobile · Stacked digest" width={390} height={1248}><MobStack /></DCArtboard>
          <DCArtboard id="m3" label="Mobile · Activity-led (stale state)" width={390} height={1024}><MobFeed /></DCArtboard>
          <DCArtboard id="d1" label="Desktop · Tabbed leaderboard + rail" width={1200} height={620}><DeskSeg /></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
