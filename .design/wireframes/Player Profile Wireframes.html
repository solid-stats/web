<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Player Profile — Wireframes (dark, mobile-first)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0a0e12; }
  * { -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wf-kit.jsx"></script>
<script type="text/babel" src="wf-stats.jsx"></script>
<script type="text/babel" src="wf-desktop.jsx"></script>
<script type="text/babel" src="wf-player.jsx"></script>

<script type="text/babel" data-presets="react">
  function App() {
    return (
      <DesignCanvas>
        <DCSection id="desktop" title="Player profile — layout directions (desktop)" subtitle="Grounded in the real legacy page (player/Sonr): performance chart with metric toggle (Kills / K/D / Score), extended career summary (rank · kills · vehicle K + % · veh destroyed · TK · deaths-from-TK · deaths · K/D · Score), by-rotation table, and weapon / vehicle breakdowns (kills + max distance). Layered on top — our product's additions: canonical player (nickname history + multiple SteamIDs), provenance / Unknown, commander-side (KS), bounty. The two directions differ in where IDENTITY lives.">
          <DCArtboard id="dA" label="A · Identity top-band + perf chart + summary + right identity rail" width={1240} height={980}><DeskProfileA /></DCArtboard>
          <DCArtboard id="dB" label="B · Sticky identity sidebar (left) + single-scroll content" width={1240} height={980}><DeskProfileB /></DCArtboard>
        </DCSection>
        <DCSection id="mobile" title="Player profile — mobile" subtitle="A = stats-led (tile grid + segmented Rotations / Weapons / Identity) · B = identity-led (provenance foregrounded). Pick the emphasis; the chosen desktop direction inherits it.">
          <DCArtboard id="mA" label="A · Stats-led — tiles + segmented + rotation cards" width={390} height={812}><MobProfileA /></DCArtboard>
          <DCArtboard id="mB" label="B · Identity-led — provenance first" width={390} height={812}><MobProfileB /></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
