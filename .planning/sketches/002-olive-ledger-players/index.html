<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solid Stats - Olive Ledger Players</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=Manrope:wght@500;600;700;800&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --bg: #0b0b0a;
      --bg-soft: #11110f;
      --surface: #171714;
      --surface-2: #22221d;
      --surface-3: #2d2c26;
      --line: #3a392f;
      --line-strong: #565241;
      --text: #f4f2e9;
      --muted: #a9a596;
      --soft: #d3cdbb;
      --accent: #8fb36b;
      --accent-ink: #0d1209;
      --warn: #d0a84d;
      --danger: #d86a5f;
      --shadow: 0 24px 90px rgb(0 0 0 / 0.42);
      --font-ui: "Manrope", system-ui, sans-serif;
      --font-heading: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
      --font-num: "Roboto Condensed", "Cascadia Mono", monospace;
    }

    html { background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        linear-gradient(180deg, rgb(143 179 107 / 0.06), transparent 26rem),
        repeating-linear-gradient(90deg, rgb(255 255 255 / 0.018) 0 1px, transparent 1px 112px),
        var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 78%, white);
      outline-offset: 2px;
    }

    .page {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .app-shell {
      display: grid;
      gap: 18px;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      box-shadow: 0 1px 0 rgb(255 255 255 / 0.03) inset;
      padding: 12px;
    }

    .brand {
      display: flex;
      gap: 11px;
      align-items: center;
      min-width: 0;
    }

    .brand-logo {
      display: flex;
      width: 116px;
      height: 58px;
      flex: 0 0 116px;
      align-items: center;
      justify-content: center;
    }

    .brand-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-name {
      color: var(--text);
      font: 800 22px/0.95 var(--font-heading);
      text-transform: uppercase;
    }

    .brand-sub {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      gap: 8px;
      align-items: center;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav::-webkit-scrollbar { display: none; }

    .nav button,
    .utility button,
    .control-button {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--soft);
      padding: 0 13px;
      font-weight: 800;
      white-space: nowrap;
      transition: border-color 0.16s ease, background 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    .nav button:hover,
    .utility button:hover,
    .control-button:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: var(--surface-3);
      color: var(--text);
    }

    .nav button.active {
      border-color: color-mix(in srgb, var(--accent) 70%, var(--line));
      background: color-mix(in srgb, var(--accent) 14%, var(--surface-2));
      color: var(--text);
    }

    .utility {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: end;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) repeat(3, minmax(160px, 220px)) auto;
      gap: 10px;
      align-items: end;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      padding: 12px;
    }

    .field {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .field label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .input,
    select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg-soft);
      color: var(--text);
      padding: 0 12px;
      outline: 0;
    }

    .input-wrap {
      display: flex;
      gap: 9px;
      align-items: center;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg-soft);
      padding: 0 12px;
    }

    .input-wrap .input {
      min-height: 42px;
      border: 0;
      background: transparent;
      padding: 0;
    }

    .control-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
    }

    .table-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: color-mix(in srgb, var(--surface) 97%, transparent);
      box-shadow: var(--shadow);
    }

    .table-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .result-count {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--soft);
      font-size: 13px;
      font-weight: 900;
    }

    .sort-chip {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      padding: 0 11px;
      font-size: 12px;
      font-weight: 900;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 13px 14px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      background: var(--surface);
    }

    th.numeric,
    td.numeric {
      text-align: right;
      white-space: nowrap;
    }

    tbody tr {
      transition: background 0.16s ease;
    }

    tbody tr:hover {
      background: color-mix(in srgb, var(--accent) 7%, transparent);
    }

    tbody tr:last-child td { border-bottom: 0; }

    .rank {
      color: var(--muted);
      font: 800 15px/1 var(--font-num);
      width: 54px;
    }

    .player {
      display: flex;
      gap: 12px;
      align-items: center;
      min-width: 220px;
    }

    .avatar {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--soft);
      font: 800 14px/1 var(--font-num);
    }

    .player-name {
      color: var(--text);
      font-size: 15px;
      font-weight: 900;
    }

    .player-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .num {
      color: var(--text);
      font: 800 16px/1 var(--font-num);
      font-variant-numeric: tabular-nums;
    }

    .muted-num {
      color: var(--soft);
      font: 800 16px/1 var(--font-num);
    }

    .calc {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 32px;
      min-width: 54px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0 7px;
      color: var(--text);
      font: 800 16px/1 var(--font-num);
      font-variant-numeric: tabular-nums;
      background: transparent;
    }

    .calc::after {
      content: "";
      width: 4px;
      height: 4px;
      margin-left: 6px;
      border-radius: 999px;
      background: var(--accent);
      opacity: 0.72;
    }

    .calc:hover,
    .calc:focus-visible {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }

    .calc-tip {
      position: absolute;
      right: 0;
      bottom: calc(100% + 8px);
      z-index: 10;
      display: none;
      width: max-content;
      max-width: 280px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--surface-3);
      color: var(--soft);
      box-shadow: var(--shadow);
      padding: 10px 11px;
      text-align: left;
      white-space: normal;
      font: 700 12px/1.45 var(--font-ui);
    }

    .calc-tip strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text);
      font-size: 12px;
      text-transform: uppercase;
    }

    .calc:hover .calc-tip,
    .calc:focus-visible .calc-tip {
      display: block;
    }

    .mobile-list {
      display: none;
      gap: 10px;
      padding: 12px;
    }

    .mobile-row {
      display: grid;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg-soft);
      padding: 12px;
    }

    .mobile-row-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .mobile-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .mobile-stat {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      padding: 9px;
    }

    .mobile-stat span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .mobile-stat strong {
      display: block;
      margin-top: 6px;
      color: var(--text);
      font: 800 18px/1 var(--font-num);
    }

    .empty {
      display: none;
      padding: 34px 16px;
      color: var(--muted);
      text-align: center;
      font-weight: 800;
    }

    @media (max-width: 1100px) {
      .topbar { grid-template-columns: 1fr; }
      .utility { justify-content: stretch; }
      .utility button { flex: 1; }
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .field.search { grid-column: 1 / -1; }
      .control-button.primary { grid-column: 1 / -1; }
      .table-card { overflow-x: auto; }
      table { min-width: 1180px; }
    }

    @media (max-width: 720px) {
      .page { padding: 10px; }
      .app-shell { gap: 14px; }
      .topbar {
        border-radius: 12px;
        padding: 10px;
      }
      .brand-logo {
        width: 96px;
        height: 48px;
        flex-basis: 96px;
      }
      .nav {
        display: grid;
        grid-template-columns: 1fr;
        overflow: visible;
      }
      .nav button { width: 100%; }
      .nav button {
        min-width: 0;
        overflow: hidden;
        padding: 0 10px;
      }
      .nav button:nth-child(n + 5) { display: none; }
      .nav button svg { flex: 0 0 auto; }
      .utility {
        display: grid;
        grid-template-columns: 1fr;
      }
      .utility button {
        min-width: 0;
        width: 100%;
        overflow: hidden;
      }
      .controls { grid-template-columns: 1fr; }
      .table-head {
        align-items: stretch;
        flex-direction: column;
      }
      table { display: none; }
      .mobile-list { display: grid; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true">
            <img src="../assets/logo.svg" alt="">
          </div>
          <div>
            <div class="brand-name">Solid Stats</div>
            <div class="brand-sub">public SolidGames statistics</div>
          </div>
        </div>

        <nav class="nav" aria-label="Primary">
          <button type="button"><i data-lucide="file-search"></i> Реплеи</button>
          <button class="active" type="button"><i data-lucide="table-2"></i> Игроки</button>
          <button type="button"><i data-lucide="shield"></i> Отряды</button>
          <button type="button"><i data-lucide="flag"></i> КС</button>
          <button type="button"><i data-lucide="crosshair"></i> Bounty</button>
        </nav>

        <div class="utility">
          <button type="button" aria-label="Переключить тему"><i data-lucide="sun"></i></button>
          <button type="button"><i data-lucide="log-in"></i> Steam</button>
        </div>
      </header>

      <section class="controls" aria-label="Player filters">
        <div class="field search">
          <label for="search">Поиск</label>
          <div class="input-wrap">
            <i data-lucide="search"></i>
            <input id="search" class="input" type="search" placeholder="nickname или squad">
          </div>
        </div>
        <div class="field">
          <label for="rotation">Ротация</label>
          <select id="rotation">
            <option>Все ротации</option>
            <option>2026 / May</option>
            <option>2026 / April</option>
            <option>2026 / March</option>
          </select>
        </div>
        <div class="field">
          <label for="mode">Режим</label>
          <select id="mode">
            <option>Все события</option>
            <option>Infantry</option>
            <option>Vehicle</option>
            <option>Commander side</option>
          </select>
        </div>
        <div class="field">
          <label for="sort">Сортировка</label>
          <select id="sort">
            <option>Счет desc</option>
            <option>K/D desc</option>
            <option>Kills desc</option>
            <option>Games desc</option>
          </select>
        </div>
        <button class="control-button primary" type="button" id="apply"><i data-lucide="filter"></i> Применить</button>
      </section>

      <section class="table-card">
        <div class="table-head">
          <div class="result-count"><i data-lucide="users"></i><span id="count">23 456 игроков</span></div>
          <div class="sort-chip"><i data-lucide="arrow-down-wide-narrow"></i> Счет desc</div>
        </div>

        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Игрок</th>
              <th class="numeric">Игры</th>
              <th class="numeric">Киллы</th>
              <th class="numeric">Киллы из техники</th>
              <th class="numeric">% из техники</th>
              <th class="numeric">Техника</th>
              <th class="numeric">Тимкиллы</th>
              <th class="numeric">Смерти от TK</th>
              <th class="numeric">Смерти</th>
              <th class="numeric">K/D</th>
              <th class="numeric">Счет</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>

        <div class="mobile-list" id="mobileRows"></div>
        <div class="empty" id="empty">Ничего не найдено по текущему поиску.</div>
      </section>
    </div>
  </main>

  <script>
    const players = [
      { rank: 1, name: "KOT_BARS", squad: "Northwind", games: 522, kills: 1284, vehicleKills: 312, destroyedVehicles: 84, teamkills: 21, deathsFromTk: 14, deaths: 375, score: 8420, tag: "KB" },
      { rank: 2, name: "Maks_Raptor", squad: "Steppe", games: 488, kills: 1168, vehicleKills: 244, destroyedVehicles: 71, teamkills: 18, deathsFromTk: 11, deaths: 401, score: 7810, tag: "MR" },
      { rank: 3, name: "OldManSVD", squad: "No squad", games: 441, kills: 1007, vehicleKills: 96, destroyedVehicles: 38, teamkills: 12, deathsFromTk: 19, deaths: 381, score: 6530, tag: "OS" },
      { rank: 4, name: "FROST_line", squad: "Baikal", games: 405, kills: 924, vehicleKills: 184, destroyedVehicles: 62, teamkills: 15, deathsFromTk: 9, deaths: 400, score: 6045, tag: "FL" },
      { rank: 5, name: "sokol_22", squad: "Vector", games: 398, kills: 899, vehicleKills: 151, destroyedVehicles: 57, teamkills: 23, deathsFromTk: 17, deaths: 420, score: 5740, tag: "S2" },
      { rank: 6, name: "Pioneer", squad: "Northwind", games: 377, kills: 831, vehicleKills: 122, destroyedVehicles: 43, teamkills: 9, deathsFromTk: 8, deaths: 419, score: 5215, tag: "PI" },
      { rank: 7, name: "Kurgan", squad: "Steppe", games: 352, kills: 790, vehicleKills: 171, destroyedVehicles: 49, teamkills: 11, deathsFromTk: 13, deaths: 429, score: 4980, tag: "KG" },
      { rank: 8, name: "Volga", squad: "Vector", games: 331, kills: 744, vehicleKills: 89, destroyedVehicles: 33, teamkills: 14, deathsFromTk: 10, deaths: 432, score: 4550, tag: "VG" }
    ];

    const rows = document.getElementById("rows");
    const mobileRows = document.getElementById("mobileRows");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");
    const search = document.getElementById("search");

    function formatNumber(value) {
      return value.toLocaleString("ru-RU");
    }

    function kd(player) {
      return player.deaths === 0 ? player.kills.toFixed(2) : (player.kills / player.deaths).toFixed(2);
    }

    function vehicleKillPercent(player) {
      return player.kills === 0 ? "0.0" : ((player.vehicleKills / player.kills) * 100).toFixed(1);
    }

    function calc(value, title, formula) {
      return `
        <button class="calc" type="button" aria-label="${title}: ${formula}">
          ${value}
          <span class="calc-tip" role="tooltip"><strong>${title}</strong>${formula}</span>
        </button>
      `;
    }

    function render(filter = "") {
      const q = filter.trim().toLowerCase();
      const filtered = players.filter((player) => `${player.name} ${player.squad}`.toLowerCase().includes(q));
      rows.innerHTML = filtered.map((player) => `
        <tr>
          <td class="rank">#${player.rank}</td>
          <td>
            <div class="player">
              <div class="avatar">${player.tag}</div>
              <div>
                <div class="player-name">${player.name}</div>
                <div class="player-meta">${player.squad}</div>
              </div>
            </div>
          </td>
          <td class="numeric num">${formatNumber(player.games)}</td>
          <td class="numeric num">${formatNumber(player.kills)}</td>
          <td class="numeric num">${formatNumber(player.vehicleKills)}</td>
          <td class="numeric">${calc(`${vehicleKillPercent(player)}%`, "% киллов из техники", `${formatNumber(player.vehicleKills)} / ${formatNumber(player.kills)} * 100`)}</td>
          <td class="numeric num">${formatNumber(player.destroyedVehicles)}</td>
          <td class="numeric num">${formatNumber(player.teamkills)}</td>
          <td class="numeric num">${formatNumber(player.deathsFromTk)}</td>
          <td class="numeric num">${formatNumber(player.deaths)}</td>
          <td class="numeric">${calc(kd(player), "K/D", `${formatNumber(player.kills)} / ${formatNumber(player.deaths)}`)}</td>
          <td class="numeric">${calc(formatNumber(player.score), "Счет", `${formatNumber(player.kills)} kill score + ${formatNumber(player.destroyedVehicles)} vehicle score - ${formatNumber(player.teamkills)} TK penalty`)}</td>
        </tr>
      `).join("");

      mobileRows.innerHTML = filtered.map((player) => `
        <article class="mobile-row">
          <div class="mobile-row-head">
            <div class="player">
              <div class="avatar">${player.tag}</div>
              <div>
                <div class="player-name">#${player.rank} ${player.name}</div>
                <div class="player-meta">${player.squad}</div>
              </div>
            </div>
          </div>
          <div class="mobile-stats">
            <div class="mobile-stat"><span>Игры</span><strong>${formatNumber(player.games)}</strong></div>
            <div class="mobile-stat"><span>Киллы</span><strong>${formatNumber(player.kills)}</strong></div>
            <div class="mobile-stat"><span>Из техники</span><strong>${formatNumber(player.vehicleKills)}</strong></div>
            <div class="mobile-stat"><span>% техники</span><strong>${vehicleKillPercent(player)}%</strong></div>
            <div class="mobile-stat"><span>K/D</span><strong>${kd(player)}</strong></div>
            <div class="mobile-stat"><span>Счет</span><strong>${formatNumber(player.score)}</strong></div>
          </div>
        </article>
      `).join("");

      empty.style.display = filtered.length ? "none" : "block";
      count.textContent = filtered.length === players.length ? "23 456 игроков" : `${filtered.length} найдено`;
      if (window.lucide) lucide.createIcons();
    }

    search.addEventListener("input", (event) => render(event.target.value));
    document.getElementById("apply").addEventListener("click", () => render(search.value));
    render();
  </script>
</body>
</html>
